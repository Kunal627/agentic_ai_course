services:
  local-llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda

    container_name: local-llm

    volumes:
      - ./models:/models:ro

    ports:
      - "8080:8080"

    command:
      - -m
      - /models/Qwen3-8B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      - -ngl
      - "99"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped